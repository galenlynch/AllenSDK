# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  builder: html

build:
  os: ubuntu-22.04
  tools:
      python: "3.13"
  jobs:
    post_install:
      - python -m pip install --dependency-groups docs

python:
   install:
      - method: pip
        path: .

formats:
  - epub
  - pdf